name: Build EXE for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 添加写入权限

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.21.0
        
    - name: Build EXE with PyInstaller
      run: |
        python build_exe.py

    - name: Package ZIP and checksum
      shell: pwsh
      run: |
        $exe = "dist/ImageWeeklyTool.exe"
        if (-not (Test-Path $exe)) { throw "EXE not found: $exe" }
        $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
        "$hash  ImageWeeklyTool.exe" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
        Compress-Archive -Path $exe,"dist/SHA256SUMS.txt" -DestinationPath "dist/ImageWeeklyTool-Windows.zip" -Force
        Write-Host "SHA256: $hash"
        
    - name: Upload Windows ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImageWeeklyTool-Windows
        path: dist/ImageWeeklyTool-Windows.zip
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.3.0-${{ github.run_number }}
        name: ImageWeeklyTool Windows v1.3.0
        files: |
          dist/ImageWeeklyTool-Windows.zip
          dist/SHA256SUMS.txt
        body: |
          ## 图片转换与周报合并工具
          
          请下载 `ImageWeeklyTool-Windows.zip`，解压后运行 `ImageWeeklyTool.exe`。
          ZIP 同时包含 `SHA256SUMS.txt`，可用于验证文件完整性。

          ### 功能
          - ✅ 单张、多张或文件夹 PNG 批量转 JPG
          - ✅ XLSX、XLS、CSV 周报合并
          - ✅ 深墨蓝、香槟金与暖雾白卡片式现代商务界面
          - ✅ Windows 高 DPI 与中文字体回退
          - ✅ 动态配置基础字段和追加指标
          - ✅ 重复“财务存”自动选择最后一列
          - ✅ 周报合并按钮显示在主操作区
          - ✅ 数值类型与 Excel 数字格式保持
          - ✅ 自动忽略尾部空白格式列
          - ✅ 自动移除末尾合计/总计/汇总行
          - ✅ 日志显示每个文件及最终结果行列数
          
          ### Windows 首次运行
          本程序未使用商业代码签名证书。如果 SmartScreen 提示未知发布者，请先核对 SHA-256，
          确认与 `SHA256SUMS.txt` 一致后，选择“更多信息”→“仍要运行”。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
