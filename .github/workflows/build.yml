name: Build EXE for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 添加写入权限

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.21.0
        
    - name: Build EXE with PyInstaller
      run: |
        python build_exe.py
        
    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: PNG转JPG转换器-Windows
        path: dist/PNG转JPG转换器.exe
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0-${{ github.run_number }}
        name: PNG转JPG及周报合并工具 Windows版 v1.1
        files: dist/PNG转JPG转换器.exe
        body: |
          ## PNG 转 JPG 及周报合并工具
          
          ### 功能特点
          - ✅ 批量转换 PNG 到 JPG
          - ✅ 支持选择或拖拽多个图片和文件夹
          - ✅ 自动处理透明背景
          - ✅ 合并 XLSX、XLS、CSV 周报
          - ✅ 动态配置基础字段和追加指标
          - ✅ 重复“财务存”字段自动取最后一列
          
          ### 使用方法
          1. 下载 `PNG转JPG转换器.exe`
          2. 双击运行
          3. 图片转换可选择或拖拽 PNG 文件/文件夹
          4. 点击「周报合并」打开独立合并窗口
          5. 指定主文件和同期月、本周、上周、同期周文件后保存结果
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
